name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see, and why would it make the game more fun?
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How could it work?
      description: Optional. Controls, where in the world, which RS or skate game it's inspired by…
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, links, videos of a similar feature in another game.
