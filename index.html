<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skate Scape</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }
      #hud {
        position: fixed; left: 12px; top: 10px; max-width: calc(100vw - 40px);

      #hud p { margin: 0 0 8px; }
      #hud .retry { pointer-events: auto; }
